<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход администратора — RPM</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10101d;color:#eee;font:16px Arial}
.card{width:min(420px,92%);padding:30px;background:#1b1b30;border:1px solid #39345b;border-radius:18px}
h1{color:#c8bdff;font-size:24px}
label{display:block;margin:18px 0 7px}
input{width:100%;padding:13px;border:1px solid #494365;border-radius:9px;background:#11111e;color:white}
button{width:100%;padding:13px;margin-top:22px;border:0;border-radius:9px;background:#7655d9;color:white;font-weight:bold;cursor:pointer}
#message{color:#ff9d9d;margin-top:15px}
a{color:#c8bdff}
</style>
</head>
<body>
<main class="card">
<h1>Вход администратора</h1>
<form id="loginForm">
<label>Логин</label>
<input name="username" required autocomplete="username">
<label>Пароль</label>
<input name="password" type="password" required autocomplete="current-password">
<button type="submit">Войти</button>
</form>
<div id="message" role="alert"></div>
<p><a href="/">Вернуться на главную</a></p>
</main>
<script>
document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  const message = document.getElementById("message");
  message.textContent = "Проверка данных...";
  try {
    const response = await fetch("/api/admin/login", {
      method: "POST",
      credentials: "same-origin",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        username: form.get("username"),
        password: form.get("password")
      })
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || "Ошибка входа");
    location.href = "/";
  } catch (error) {
    message.textContent = error.message;
  }
});
</script>
</body>
</html>
