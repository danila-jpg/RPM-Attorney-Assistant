<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход администратора | RPM Attorney Assistant</title>
  <link rel="stylesheet" href="/rpm-base.css">
  <link rel="stylesheet" href="/rpm-auth.css">
  <link rel="stylesheet" href="/password-visibility.css">
  <script defer src="/password-visibility.js"></script>
  <script defer src="/admin-login.js"></script>
<script type="module" src="/appearance.js"></script>
</head>
<body class="auth-page" data-appearance-cache>
<main class="auth-card">
  <div class="logo">RPM <span>ATTORNEY ASSISTANT</span></div>
  <h1>Вход администратора</h1>
  <section class="panel">
    <form id="login">
      <label>Имя пользователя<input name="username" autocomplete="username" required maxlength="32"></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label>
      <button class="primary">Войти</button>
    </form>
    <p id="status" class="status" role="status"></p>
  </section>
  <a href="/app/">Вход пользователя</a>
</main>
</body>
</html>
