
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPM Attorney Assistant — Личный кабинет</title>
<link rel="stylesheet" href="/rpm-base.css">
  <link rel="stylesheet" href="/subscription-plans.css">
<link rel="stylesheet" href="/rpm-auth.css">
<link rel="stylesheet" href="/password-visibility.css">
<script defer src="/password-visibility.js"></script>
<script type="module" src="/appearance.js"></script>
</head>
<body class="auth-page" data-appearance-cache>
  <main class="auth-card">
    <div class="logo">RPM Attorney Assistant</div>
    <div class="subtitle">Личный кабинет пользователя</div>

    <nav aria-label="Авторизация">
      <button class="nav-tab active" id="loginTab" type="button">Вход</button>
      <button class="nav-tab" id="registerTab" type="button">Регистрация</button>
    </nav>

    <section class="panel">
    <form id="loginForm">
      <div class="field">
        <label for="loginUsername">Логин</label>
        <input id="loginUsername" name="username" required
          autocomplete="username" maxlength="32">
      </div>
      <div class="field">
        <label for="loginPassword">Пароль</label>
        <input id="loginPassword" name="password" type="password"
          required autocomplete="current-password" maxlength="72">
      </div>
      <button class="submit primary" type="submit">Войти</button>
    </form>

    <form id="registerForm" hidden>
      <div class="field">
        <label for="inviteCode">Одноразовый код приглашения</label>
        <input id="inviteCode" name="inviteCode" required
          autocomplete="off">
      </div>
      <div class="field">
        <label for="registerUsername">Логин</label>
        <input id="registerUsername" name="username" required
          autocomplete="username" minlength="3" maxlength="32">
      </div>
      <div class="field">
        <label for="rpNickname">RP-никнейм</label>
        <input id="rpNickname" name="rpNickname" required
          autocomplete="off" maxlength="64">
      </div>
      <div class="field">
        <label for="registerPassword">Пароль (минимум 12 символов)</label>
        <input id="registerPassword" name="password" type="password"
          required minlength="12" maxlength="72"
          autocomplete="new-password">
      </div>
      <button class="submit primary" type="submit">Создать аккаунт</button>
    </form>

    <div class="message" id="message" role="status"></div>
    <div class="hint">
      Регистрация доступна только по одноразовому приглашению,
      полученному после подтверждения оплаты администратором.
    </div>
  </section>
  </main>
  <section class="panel subscription-catalog" aria-labelledby="catalogHeading">
    <h2 id="catalogHeading">Тарифы подписки</h2>
    <p>Все тарифы дают одинаковый доступ. Оплата игровой валютой RP подтверждается вручную.</p>
    <div id="publicPlanCards">Загрузка тарифов…</div>
  </section>
  <script type="module">
    import { mountPlanCards } from "/subscription-plans.js";
    const catalog = document.getElementById("publicPlanCards");
    mountPlanCards(catalog).catch(error => { catalog.textContent = error.message; });
  </script>

  <script>
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("visible");
    }

    function switchTab(register) {
      loginForm.hidden = register;
      registerForm.hidden = !register;
      loginTab.classList.toggle("active", !register);
      registerTab.classList.toggle("active", register);
      message.classList.remove("visible");
    }

    loginTab.addEventListener("click", () => switchTab(false));
    registerTab.addEventListener("click", () => switchTab(true));

    async function sendForm(form, endpoint) {
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      message.classList.remove("visible");

      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Не удалось выполнить запрос.");
        }

        if (result.success) {
          window.location.href = "/app/account.html";
          return;
        }

        showMessage("Сервер не подтвердил операцию.");
      } catch (error) {
        showMessage(error.message || "Ошибка подключения к серверу.");
      } finally {
        button.disabled = false;
      }
    }

    loginForm.addEventListener("submit", event => {
      event.preventDefault();
      sendForm(loginForm, "/api/customer/login");
    });

    registerForm.addEventListener("submit", event => {
      event.preventDefault();
      sendForm(registerForm, "/api/customer/register");
    });
  </script>
</body>
</html>
